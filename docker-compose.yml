services:
  postgres:
    image: postgres:16-alpine
    container_name: chethan_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: chethan_construction
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_secure_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d chethan_construction"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    name: chethan_postgres_data
