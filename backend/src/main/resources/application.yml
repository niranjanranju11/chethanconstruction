spring:
  application:
    name: chethan-construction-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  servlet:
    multipart:
      max-file-size: ${MAX_VIDEO_SIZE_BYTES:262144000}B
      max-request-size: ${MAX_VIDEO_SIZE_BYTES:262144000}B

server:
  port: ${SERVER_PORT:8080}
  error:
    include-stacktrace: never

# Application-specific configuration
app:
  base-url: ${APP_BASE_URL:http://localhost:8080}
  frontend-base-url: ${FRONTEND_BASE_URL:http://localhost:5173}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}
  jwt:
    secret: ${JWT_SECRET:super-secret-jwt-signing-key-for-chethan-construction-min-256-bits}
    access-token-minutes: ${JWT_ACCESS_TOKEN_MINUTES:15}
    refresh-token-days: ${JWT_REFRESH_TOKEN_DAYS:7}
  admin:
    initial-email: ${ADMIN_INITIAL_EMAIL:admin@chethanconstruction.com}
    initial-password: ${ADMIN_INITIAL_PASSWORD:AdminPassword123!}
  r2:
    endpoint: ${R2_ENDPOINT:https://placeholder.r2.cloudflarestorage.com}
    access-key-id: ${R2_ACCESS_KEY_ID:placeholder-access-key}
    secret-access-key: ${R2_SECRET_ACCESS_KEY:placeholder-secret-key}
    bucket: ${R2_BUCKET:chethan-construction-media}
    region: ${R2_REGION:auto}
    public-base-url: ${MEDIA_PUBLIC_BASE_URL:https://media.chethanconstruction.com}
    mock-mode: ${R2_MOCK_MODE:true}
  media:
    max-image-size: ${MAX_IMAGE_SIZE_BYTES:10485760}
    max-video-size: ${MAX_VIDEO_SIZE_BYTES:262144000}

# Actuator & Swagger
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when_authorized

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs
